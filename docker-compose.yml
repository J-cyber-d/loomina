version: '3.8'

services:
  # Metadata database for Loomina (organizations, dashboards, widgets, api keys)
  postgres:
    image: postgres:16-alpine
    container_name: loomina-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: loomina_metadata
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
